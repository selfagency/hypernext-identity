# golangci-lint v2 configuration.
# Run: golangci-lint run ./...   (add --fix to auto-format)
version: "2"

linters:
  # Standard set: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - gosec        # SAST: security static analysis
    - misspell     # typo detection
    - revive       # golint successor (style)
    - bodyclose    # ensure response bodies are closed
    - noctx        # enforce context.Context on http calls
    - gocritic     # performance/correctness/style checks
  settings:
    revive:
      rules:
        - name: exported
          severity: warning
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
  exclusions:
    generated: lax
    rules:
      # Test files: allow unchecked errors in setup, skip some SAST noise.
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - noctx
      # Example config values are not real secrets.
      - path: config\.example\.yml
        linters:
          - gosec
      # Storage backend's job is opening files by key; path is sanitized
      # against traversal in FS.path. G304 is a false positive here.
      - path: internal/storage/fs\.go
        linters:
          - gosec
      # auth/storage.go implements the zitadel/oidc op.Storage and op.Client
      # interfaces; every method is required by the interface and must be
      # exported. Doc comments on each would be pure noise.
      - path: internal/auth/storage\.go
        linters:
          - revive
          - gocritic
      # store.go chmods the data directory to 0700 (owner-only). G302 expects
      # <=0600, but directories need the execute bit to be traversable; 0700
      # is the correct owner-only directory mode.
      - path: internal/store/store\.go
        linters:
          - gosec

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/hypernext/identity)
