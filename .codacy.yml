---
# Codacy configuration.
# Exclude AGENTS.md from static analysis: it is an agent-guidance document,
# not code, and Codacy's doc-quality rules (acronyms, vague instructions,
# absolute rules) flag it heavily. The file is intentionally terse prose.
exclude_paths:
  - "AGENTS.md"
  - "AGENTS.original.md"

# Per-tool configuration. golangci-lint (which wraps gosec) flags the WKD
# z-base-32 hash (SHA-1) as insecure, but SHA-1 is mandated by the WKD spec
# for the localpart hash and is not used for security. Exclude the endpoints
# package from golangci-lint's weak-crypto check.
engines:
  golangci-lint:
    exclude_paths:
      - "internal/endpoints/endpoints.go"
