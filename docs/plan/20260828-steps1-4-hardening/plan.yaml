open_questions:
  - question: "Is the first-user admin instance-scoped or tenant-scoped?"
    context: "CreateUser (store/auth.go:151) makes the first user in the whole store the instance admin, unscoped by tenant. Admin routes live on the identity host (instance-level). Decision feeds T4 (B8)."
    type: decision_blocker
    affects: [T4]
assumptions:
  - "golang.org/x/crypto is already a dependency (ssh uses it); argon2id is a subpackage — no new dependency for B4."
  - "B4 uses argon2id (avoids bcrypt 72-byte truncation) and enforces a max client-secret length in CreateClient as defense-in-depth."
  - "The version build variable `var version = \"dev\"` in cmd/sovereign/main.go is the single source of truth for F3; pass it as a separate parameter to New(cfg, version), NOT via server.Config (version is a build-time constant, not an operator-configurable YAML key)."
  - "Migration v5 (B4) re-registration path is an admin CLI command `sovereign clients set-secret <id>` (CreateClient's INSERT unique on client_id blocks plain re-registration)."
  - "Migration v6 (E2) grace policy: existing valid refresh tokens survive the migration; rotation/reuse-detection applies to tokens issued after migration (avoids mass logout)."
  - "E2 reuse-detection retry false-positive (client retries after lost response / parallel refresh redeems already-rotated token) is acceptable per OAuth2 BCP; documented in the migration spec."
  - "Refresh-token rotation/reuse detection can reuse the existing auth_refresh_tokens schema (expires_at exists); a small migration v6 is acceptable if a family/rotation marker is required."
  - "No gem-debugger tasks: the review already diagnosed every root cause; implementers fix directly."
pre_mortem:
  overall_risk_level: high
  critical_failure_modes:
    - scenario: "Strict config (F1) rejects a production config that still carries unimplemented keys, so the server refuses to boot."
      likelihood: high
      impact: high
      mitigation: "F1-docs (T14) ships the exact key-removal list in CHANGELOG as a breaking change; Validate() error message names the offending key; T2 rejected-key list and T14 removed-key list are kept in lockstep."
    - scenario: "B4 migration v5 invalidates plaintext client secrets, breaking existing OIDC clients until operators re-register them."
      likelihood: high
      impact: high
      mitigation: "Migration sets a sentinel hash and logs affected client IDs; re-registration path is the admin CLI `sovereign clients set-secret <id>`; CHANGELOG documents the step; T-critic2 reviews the strategy."
    - scenario: "E2 refresh-token rotation introduces a reuse-detection false positive that revokes a legitimate session."
      likelihood: medium
      impact: high
      mitigation: "Rotation deletes old token + inserts new in one transaction; reuse detection keys on the old token hash; in-memory map entry deleted on rotation and revocation; retry false-positive documented as acceptable per OAuth2 BCP; concurrency test covers single-use."
    - scenario: "A1 fail-closed startup makes the server refuse to boot when OIDC/WebAuthn init fails, taking down a previously 'working' (but auth-less) deployment."
      likelihood: medium
      impact: high
      mitigation: "This is the intended behavior (fail closed). CHANGELOG documents that a boot failure now means auth is misconfigured, not ignorable."
    - scenario: "A2 tenant-resolution rewrite regresses the keys/proofs endpoints, serving empty or cross-tenant data."
      likelihood: medium
      impact: critical
      mitigation: "Tests rewritten to seed real tenants (ID != handle); cross-tenant IDOR test added; T16 review verifies tenant.FromContext usage."
    - scenario: "Coverage budget not met for cmd/sovereign (62.5%) or internal/authstore (75.7%), failing the 80% gate."
      likelihood: medium
      impact: medium
      mitigation: "T17 (coverage budget) explicitly targets both packages to >=80% before T16 review; T2/T7 add coverage where feasible."
