plan_id: 20260828-steps1-4-hardening
objective: "Implement remediation Steps 1-4 from the exhaustive code review of sovereign@edc4ed1: (1) fail-closed startup + truthful docs, (2) tenant identity resolution, (3) atomicity races, (4) auth primitive hardening. Steps 5-8 are OUT OF SCOPE."
created_at: 2026-08-28T00:00:00Z
created_by: gem-planner
status: completed
tldr: |
  HIGH-complexity, security-sensitive, cross-domain hardening of the sovereign Go server.
  19 tasks across 5 waves. Wave 1 lays foundations (host normalization, strict config,
  atomic invite, conn pool, access-token claims, key parsing, two design decisions).
  Wave 2 fixes tenant identity resolution (A2) + first-admin atomicity. Wave 3 makes
  startup fail-closed (A1) and hashes client secrets (B4, breaking migration). Wave 4
  makes NodeInfo truthful (F3) and hardens refresh-token lifecycle (E2). Wave 5 is docs
  (F1-docs, F4) + coverage budget + full security review. Two breaking changes: strict
  config parsing and client-secret/refresh-token invalidation, both documented as
  operator migration steps. Revised per reviewer+critic amendments: atomic invite keeps
  InviteTokenByHash for UserID + error classification; MemoryStore hashes secrets;
  version passed to New(cfg, version) not via Config; migration v5 adds re-registration
  CLI; coverage budget task added for cmd/sovereign + authstore.

