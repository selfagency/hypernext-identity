# Hypernext Identity Server — example configuration
# Copy to config.yml and edit. All values shown are defaults.

# Base domain for the identity server (the apex, e.g. example.com).
# Tenant handles live on subdomains of this (alice.example.com).
domain: example.com

# Where the identity server itself is served (OIDC issuer, admin UI).
# Defaults to "id.<domain>".
# identity_host: id.example.com

# Data directory: sqlite files, blobs, keys, certmagic cache.
data_dir: ./data

# Storage backend for protocol blobs (Solid, remoteStorage, atproto blobs).
#   fs:  local filesystem under data_dir/blobs
#   s3:  any S3-compatible endpoint
storage:
  backend: fs
  # CORS allowlist for credentialed protocol endpoints (remoteStorage).
  # Empty disables CORS. A wildcard is never emitted for credentialed requests.
  # allowed_origins:
  #   - https://app.example.com
  # s3:
  #   endpoint: https://s3.example.com
  #   bucket: hypernext-blobs
  #   access_key: ...
  #   secret_key: ...
  #   region: us-east-1

# SQLite: one file per tenant (WAL mode). Per-tenant isolates write contention.
sqlite:
  mode: per_tenant   # per_tenant | single
  # single:
  #   path: ./data/identity.db

# TLS / ACME (wildcard cert for tenant subdomains). Uses certmagic.
# NOTE: TLS termination is not yet implemented; this config is reserved.
tls:
  enabled: false
  email: admin@example.com

# IPFS integration (optional, off by default). Broker mode — no embedded node.
# NOTE: the IPFS pinning client is not yet wired into the blob flow.
ipfs:
  enabled: false

# atproto PDS
atproto:
  # did method for new accounts: plc (default) | web
  did_method: plc

# Backup schedule (also configurable via admin UI)
backup:
  # cron_expr: "0 3 * * *"

# Logging
log:
  level: info   # debug | info | warn | error
  format: text  # text | json
